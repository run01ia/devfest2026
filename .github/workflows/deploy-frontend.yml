name: Deploy frontend to Cloud Run

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set env by branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "service_name=nextjs-frontend-prod" >> $GITHUB_OUTPUT
          else
            echo "service_name=nextjs-frontend-dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloud Run from Source
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ steps.vars.outputs.service_name }}
          source: ./frontend
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --port 8080'
